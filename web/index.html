<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#131a23"><meta name="color-scheme" content="dark">
<title>诡境 · 围坐，听一个秘密</title>
<style>
:root {
  --bg: #131a23;
  --panel: #1b2530;
  --raised: #263340;
  --line: #364350;
  --text: #f2ede4;
  --muted: #a9b2bb;
  --gold: #ccb789;
  --red: #d49a87;
  --green: #a3bca7;
  --paper: #e7dfcf;
  --ink: #29303a;

  --sans: -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif;
}
* { box-sizing: border-box; }
html { scroll-behavior: smooth; }
body { margin: 0; background: var(--bg); color: var(--text); font: 16px/1.8 var(--sans); min-height: 100vh; }

button, input, select, textarea { font: inherit; }
button, a, input, select, summary { touch-action: manipulation; }
button, a { -webkit-tap-highlight-color: transparent; }
button { cursor: pointer; min-height: 46px; border: 1px solid var(--line); border-radius: 5px; padding: 10px 18px; background: var(--raised); color: var(--text); transition: background .15s, border-color .15s; }
button:hover { background: #324251; border-color: #64717c; }
button:disabled { opacity: .46; cursor: default; }
.primary { background: var(--gold); color: #1b242d; border-color: var(--gold); font-weight: 600; }
.primary:hover { background: #dfccaa; border-color: #dfccaa; }
.ghost { background: transparent; }
.danger { color: var(--red); }
a { color: var(--gold); text-underline-offset: 4px; }
a.button { display: inline-flex; align-items: center; justify-content: center; text-decoration: none; min-height: 46px; border: 1px solid var(--line); border-radius: 5px; padding: 10px 18px; color: var(--text); }
a.button:hover { border-color: var(--muted); }
button:focus-visible, a:focus-visible, input:focus-visible, select:focus-visible, textarea:focus-visible, summary:focus-visible { outline: 2px solid var(--gold); outline-offset: 4px; }
h1, h2, h3, p { margin: 0; }
h1, h2, h3 { font-family: var(--serif); font-weight: 500; line-height: 1.45; }
h1 { font-size: clamp(38px, 5vw, 68px); letter-spacing: .03em; }
h2 { font-size: 28px; }
h3 { font-size: 21px; }
p + p { margin-top: 12px; }
small, .small { font-size: 13px; color: var(--muted); }
.muted { color: var(--muted); }
.eyebrow { color: var(--muted); font: 13px/1.6 var(--sans); margin-bottom: 12px; letter-spacing: .03em; }
.row { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
.between { justify-content: space-between; }
.stack > * + * { margin-top: 20px; }
.tight > * + * { margin-top: 10px; }
.fill { width: 100%; }
.hidden { display: none !important; }
.app { max-width: 1376px; margin: auto; padding: 26px 48px 90px; }
.masthead { border-bottom: 1px solid var(--line); padding-bottom: 20px; margin-bottom: 30px; min-height: 54px; }
.brand { display: inline-flex; align-items: center; gap: 16px; font-family: var(--serif); font-size: 26px; letter-spacing: .14em; color: var(--text); text-decoration: none; }
.brand small { font: 12px var(--sans); letter-spacing: .04em; color: var(--muted); border-left: 1px solid #65717d; padding-left: 16px; }
.status { display: inline-flex; align-items: center; font-size: 12px; color: var(--green); }
.status::before { content: ""; display: inline-block; width: 6px; height: 6px; margin-right: 7px; border-radius: 50%; background: currentColor; }
.status.off { color: var(--red); }
.card { border: 1px solid var(--line); border-radius: 7px; background: var(--panel); padding: 24px; }
.hero { display: grid; grid-template-columns: 1fr 1fr; gap: 48px; align-items: center; padding: 16px 0 44px; min-height: 420px; }
.hero-text { max-width: 560px; }
.hero h1 { margin-bottom: 26px; }
.hero p { color: #bbc2c9; max-width: 440px; font-size: 17px; line-height: 1.95; }
.hero .eyebrow { font-size: 14px; color: var(--gold); margin-bottom: 22px; }
.hero-note { margin-top: 25px; display: flex; gap: 24px; color: var(--muted); font-size: 13px; }
.hero-note span + span { position: relative; }
.hero-note span + span::before { position: absolute; content: ""; width: 3px; height: 3px; background: var(--muted); border-radius: 50%; top: 11px; left: -13px; }
.scene { height: 380px; position: relative; margin: 0; display: grid; place-items: center; isolation: isolate; }
.letter { position: absolute; width: min(86%, 350px); min-height: 290px; top: 10px; padding: 26px 30px 65px; color: var(--ink); background: var(--paper); transform: rotate(-5deg); border: 1px solid #d0c5af; box-shadow: 12px 16px 0 #0d141a44, 0 18px 40px #0003; animation: letter-enter .65s ease-out both; }
.letter-address { font-size: 12px; letter-spacing: .1em; color: #59615f; padding-bottom: 18px; border-bottom: 1px solid #bcb5a5; }
.letter h2 { font-size: 37px; margin: 15px 0 12px; letter-spacing: .09em; }
.letter p { color: #535b59; font-family: var(--serif); font-size: 15px; line-height: 1.9; }
.letter-foot { font-size: 11px; color: #59615f; margin-top: 18px; }
.envelope { position: absolute; bottom: 20px; width: min(96%, 420px); height: 145px; background: #a99b82; border: 1px solid #978a72; box-shadow: 0 15px 28px #0003; transform: rotate(2deg); }
.envelope::before { content: ""; position: absolute; inset: 0; background: #b6a88f; clip-path: polygon(0 0, 50% 70%, 100% 0, 100% 100%, 0 100%); }
.envelope::after { content: ""; position: absolute; inset: 0; background: #c3b599; clip-path: polygon(0 100%, 50% 22%, 100% 100%); }
.envelope-seal { position: absolute; z-index: 1; width: 50px; height: 50px; border: 1px solid #743f34; outline: 3px solid #995b46; background: #995b46; border-radius: 50%; color: #ead6bc; font: 25px/48px var(--serif); text-align: center; left: calc(50% - 25px); top: 56px; box-shadow: 2px 3px 7px #1b171633; }
.scene-caption { position: absolute; bottom: -17px; font-size: 12px; color: var(--muted); letter-spacing: .04em; }
.home-grid { display: grid; grid-template-columns: 1.25fr 1fr; gap: 34px; padding-top: 25px; border-top: 1px solid var(--line); }
.story-card { background: transparent; border: 0; padding: 6px 34px 8px 0; border-right: 1px solid var(--line); border-radius: 0; }
.story-card h2 { margin-bottom: 14px; font-size: 29px; }
.story-card select { margin-bottom: 24px; }

.join-home .form-actions { margin-top: 12px; }
#room-input { font-size: 22px; letter-spacing: .16em; font-variant-numeric: tabular-nums; }
label { display: block; font-size: 14px; color: var(--muted); margin-bottom: 7px; }
input, select, textarea { width: 100%; border: 1px solid #53606b; border-radius: 4px; background: #151e28; color: var(--text); padding: 12px 14px; min-height: 48px; }
input::placeholder, textarea::placeholder { color: #9aa5af; }

.field + .field { margin-top: 16px; }
.form-actions { margin-top: 22px; display: flex; gap: 12px; flex-wrap: wrap; }
.phase { display: flex; gap: 12px; align-items: flex-start; padding: 0; margin: 0 0 27px; list-style: none; }
.phase li { flex: 1; border-top: 2px solid #34404c; padding-top: 10px; font-size: 12px; color: #a2abb6; }

.phase li.done { color: #c3cacd; border-color: #6e7d86; }

.game-head { margin-bottom: 25px; }
.game-head h1 { font-size: clamp(29px, 3vw, 39px); letter-spacing: .02em; margin-bottom: 9px; }
.stage-note { color: var(--muted); max-width: 780px; font-size: 15px; }
.host-heading { display: flex; align-items: flex-start; justify-content: space-between; gap: 24px; }
.stage-meter { flex-shrink: 0; text-align: right; color: var(--muted); font-size: 12px; }
.stage-meter strong { display: block; color: var(--text); font: 27px/1.3 var(--serif); font-variant-numeric: tabular-nums; }
.host-grid { display: grid; grid-template-columns: minmax(0, 1fr) 280px; gap: 28px; align-items: start; }
.host-main > * + *, .sidebar > * + * { margin-top: 22px; }
.host-main { min-width: 0; }
.host-message { border-left: 3px solid var(--gold); border-radius: 0 5px 5px 0; background: #1b2530; }
.host-message h2 { font-size: 24px; }
.host-message .eyebrow { color: var(--muted); }
.host-lobby { display: grid; grid-template-columns: minmax(0, 1fr) 335px; gap: 30px; }
.lobby-letter { padding: 26px 30px; border: 1px solid var(--line); background: #1a2430; }
.lobby-letter .scene { height: 295px; max-width: 440px; margin: 0 auto 26px; }
.lobby-letter .letter { min-height: 235px; width: 290px; top: 0; padding-top: 20px; }
.lobby-letter .letter h2 { font-size: 31px; }
.lobby-letter .letter-foot { display: none; }
.lobby-letter .envelope { width: 340px; height: 115px; bottom: 0; }
.lobby-letter .envelope-seal { top: 42px; }
.lobby-letter .scene-caption { display: none; }
.lobby-letter h2 { margin-bottom: 12px; }
.lobby-players { margin-top: 20px; }
.roomcode { font-size: 30px; letter-spacing: .15em; color: var(--gold); font-variant-numeric: tabular-nums; }
.qr { display: block; width: 100%; max-width: 224px; aspect-ratio: 1; margin: 18px auto; background: white; border: 8px solid white; border-radius: 3px; }
.join-card { background: #202b37; }
.join-card .room-label { font-size: 12px; color: var(--muted); margin-bottom: 2px; }
.join-card h3 { font-size: 23px; }
.join-card select { font-size: 12px; min-height: 44px; padding: 9px; }

.join-actions { display: grid; gap: 9px; margin-top: 16px; }

.players { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px; margin-top: 18px; }
.seat { background: #18222d; border: 1px solid #394653; border-radius: 4px; padding: 13px; min-width: 0; }

.anchor b { font: 23px/1.4 var(--serif); font-variant-numeric: tabular-nums; color: var(--gold); display: block; }
.anchor small { font-size: 12px; display: block; margin-top: 4px; }
.section-title { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin: 27px 0 14px; }
.section-title h2, .section-title h3 { font-size: 23px; }
.count { font: 12px var(--sans); color: var(--muted); flex-shrink: 0; }
.evidence-grid { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 13px; align-items: start; }
.evidence { --text: #29303a; --muted: #5b625f; --line: #bcb7a8; --gold: #78543b; color: var(--text); border: 1px solid #c6bdab; border-radius: 3px; background: var(--paper); overflow: hidden; overflow-wrap: anywhere; }
.evidence summary { padding: 15px 16px; cursor: pointer; list-style: none; display: flex; align-items: center; justify-content: space-between; gap: 8px; min-height: 96px; }
.evidence summary::-webkit-details-marker { display: none; }
.evidence summary::after { content: "+"; font-size: 20px; font-weight: 300; color: #6c6659; flex-shrink: 0; }
.evidence[open] summary::after { content: "−"; }
.evidence summary strong { font-weight: 600; font-size: 16px; }
.ev-id { color: #59615f; font: 11px/1.6 var(--sans); display: block; margin-bottom: 7px; }
.ev-body { padding: 0 16px 18px; white-space: pre-line; color: #303a40; font-size: 15px; line-height: 1.95; }
.ev-body .row { margin-top: 16px; }
.ev-body button { background: #d4cbbc; color: #26313b; border-color: #b7ae9c; font-size: 13px; padding: 8px 11px; }
.ev-body button:hover { background: #c7bdac; }
.ev-body .ghost { background: transparent; }
.private-hint { margin-top: 16px; border-top: 1px dashed #aaa58f; padding-top: 12px; color: #754a39; font-size: 13px; }
.question { margin-top: 14px; font-size: 14px; color: #515d60; }
.locations { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; }
.location { display: grid; grid-template-columns: 29px minmax(0, 1fr); align-content: start; gap: 6px 12px; text-align: left; padding: 17px 15px; border-color: #485561; min-height: 118px; background: #1e2a36; }
.location:not(:has(.place-icon)) { display: block; }

.location .number { color: #a8b1bb; font-size: 11px; }
.location strong { display: block; font-size: 17px; font-weight: 500; }
.location small { display: block; font-size: 12px; line-height: 1.6; }
.phone { max-width: 660px; margin: auto; }
.phone .card { padding: 23px; }
.phone .evidence-grid { grid-template-columns: 1fr; }
.phone .prose { font-size: 16px; }
.phone .game-head .eyebrow { margin-bottom: 9px; color: var(--gold); }
.role-card { --text: #29303a; --muted: #59615f; --line: #beb7a8; --gold: #78543b; --raised: #d9d1c2; background: var(--paper); color: var(--text); border: 1px solid #cbc1af; border-radius: 3px; position: relative; }

.role-card .primary { background: #263440; border-color: #263440; color: #f2ede4; }

.role-card .notice { background: #d9d1c2; color: #35413e; }

.role-name { font-size: 38px; margin: 8px 0; }

.tabs { position: fixed; bottom: 0; left: 0; right: 0; z-index: 20; display: flex; justify-content: center; gap: 8px; padding: 8px 18px calc(8px + env(safe-area-inset-bottom)); background: #131a23f7; border-top: 1px solid var(--line); backdrop-filter: blur(12px); }

.rules { font-size: 14px; color: var(--muted); padding-left: 21px; }

<body><div id="app" class="app"><p class="loading">正在打开卷宗…</p></div><div id="toast" class="toast hidden" role="alert"></div>
<dialog id="confirm"><h2 id="confirm-title"></h2><p class="muted" id="confirm-text" style="margin-top:15px"></p><div class="form-actions"><button id="confirm-cancel">取消</button><button class="primary" id="confirm-ok">继续</button></div></dialog>
<script type="module">
const $ = s => document.querySelector(s);

const drafts = new Map();
const investigatorSelections = new Map();
let selectedStoryId;
const query = new URLSearchParams(location.search);
const demo = query.has('demo');

let lastStage, renderedViewKey;
const stageLabels = {dossier:'读角色',opening:'开场',search1:'初查',search2:'深查',confrontation:'对质',vote:'指认',ended:'揭晓'};
const personName = id => { const p = state?.public.players.find(p => p.id === id); return p ? `${p.nickname}${p.role ? `（${p.role.brief}）` : ''}` : '玩家'; };
const roleName = id => state.public.players.find(p => p.role?.id === id)?.role.name || id;
const countWord = n => ['零','一','二','三','四','五','六','七','八'][n] || String(n);
const locationName = id => state.public.locations.find(l => l.id === id)?.name || id;
function notify(message) { clearTimeout(toastTimer); $('#toast').textContent = message; $('#toast').classList.remove('hidden'); toastTimer = setTimeout(() => $('#toast').classList.add('hidden'), 5000); }
function storageKey(mode, room) { return `sr:${mode}:${room}`; }
function remember(mode, room, value) { localStorage.setItem(storageKey(mode, room), JSON.stringify(value)); localStorage.setItem(`sr:last:${mode}`, room); }
function recalled(mode, room) { try { return JSON.parse(localStorage.getItem(storageKey(mode, room)) || 'null'); } catch { return null; } }
async function api(path, { method = 'GET', body, credential } = {}) {
  const response = await fetch(path, { method, headers: { ...(body ? {'Content-Type':'application/json'} : {}), ...(credential ? {Authorization:`Bearer ${credential}`} : {}) }, ...(body ? {body:JSON.stringify(body)} : {}) });
  const result = await response.json(); if (!response.ok) { const error = new Error(result.error || '操作没有完成。'); error.status = response.status; throw error; } return result;
}
async function getState(credential = token) {
  if(demo&&credential===token){const [shared,own]=await Promise.all([api(`/api/rooms/${code}/state`,{credential:hostToken}),api(`/api/rooms/${code}/state`,{credential})]);return {...shared,me:own.me};}
  return api(`/api/rooms/${code}/state`, {credential});

function showFatal(message) { source?.close(); app.innerHTML = `${header()}<div class="card error-card stack"><h2>暂时无法进入</h2><p class="muted">${esc(message)}</p><a class="button" href="/">回到首页</a>${code && !hostMode && !demo ? '<button data-do="rejoin">重新填写昵称加入</button>' : ''}</div>`; }
function setState(next) { const changed=lastStage!==undefined&&lastStage!==next.public.stageId; state=next; if(next.public.stage!=='vote')$('#print-ballots')?.remove(); if(lastStage!==next.public.stageId){tab='current';lastStage=next.public.stageId;} render();if(changed)window.scrollTo({top:0,behavior:'instant'}); }
function connect() {
  source?.close(); connected = false;
  source = new EventSource(`/api/rooms/${code}/events?token=${encodeURIComponent(demo?hostToken:token)}`);
  source.addEventListener('state', async event => {
    connected = true;
    if(!demo){setState(JSON.parse(event.data));return;}
    const selected=token;

function header() {
  return `<header class="masthead row between">

function home() {

    return `<div class="seat ${p.ready?'is-ready':''}"><span class="connection-dot ${p.online?'on':''}">${p.online?'● 在线':'○ 暂时离线'}</span><strong>${esc(p.role?.name||p.nickname)}</strong>${p.role?`<small>${esc(p.role.brief)}</small>`:''}<div class="state">${esc(status)}</div>${removable?`<button class="remove ghost danger" data-do="remove" data-id="${esc(p.id)}">移除席位</button>`:''}</div>`;
  }).join('')}</div>`;
}
function anchors(pub) { return `<div class="anchors">${pub.anchors.map(a=>`<div class="anchor"><b>${esc(a.time)}</b><small>${esc(a.text)}</small></div>`).join('')}</div>`; }
function dossier(role) {

function evidenceCard(e,{mine=false,canAct=false}={}) {

  return `<details class="evidence" data-detail="ev-${esc(e.id)}-${mine?'mine':'pub'}" ${mine||state.public.flowVersion===2&&e.round===(state.public.stage==='search1'?1:state.public.stage==='search2'?2:0)?'open':''}><summary><div><span class="ev-id">${esc(e.id)} · ${esc(locationName(e.locationId))} · 第${e.round}轮</span><strong>${esc(e.title)}</strong></div></summary><div class="ev-body">${esc(e.text)}${mine&&e.hint?`<div class="private-hint">仅你可见：${esc(e.hint)}</div>`:''}${state.public.flowVersion===2?'':`<p class="question">可以问：${esc(e.question)}</p>`}${state.public.flowVersion===2&&e.canVerify?e.verification?`<p class="notice" style="margin-top:16px">核对结果：${esc(e.verification)}</p>`:['search1','search2'].includes(state.public.stage)?`<button class="ghost" style="margin-top:16px" data-do="screen_verify" data-id="${esc(e.id)}">核对这件原物</button>`:'':''}${canAct?`<div class="row">${mine&&!published?`<button data-do="publish" data-id="${esc(e.id)}">公开物证</button>`:''}<button class="ghost" data-do="cite" data-id="${esc(e.id)}">引用这条线索提问</button>${published?'<small>已归档</small>':''}</div>`:''}</div></details>`;
}
function board(pub, canAct=false) { return `<div class="section-title"><h2>公共证据板</h2><span class="count">${pub.evidence.length}份已公开</span></div>${pub.evidence.length?`<div class="evidence-grid">${pub.evidence.map(e=>evidenceCard(e,{canAct})).join('')}</div>`:'<div class="empty-copy">还没有公开物证。找到线索后，可以先询问相关的人，再公开讨论。</div>'}${pub.citations.length?`<div class="section-title"><h3>桌上的问题</h3></div><div class="records">${pub.citations.slice(-8).reverse().map(c=>`<div class="record"><b>${esc(personName(c.playerId))}</b> 用 ${esc(c.evidenceId)} 询问 <b>${esc(personName(c.targetId))}</b><p>${esc(c.text)}</p></div>`).join('')}</div>`:''}${pub.statements.length?`<div class="section-title"><h3>人物说法 <small>尚待核实</small></h3></div><div class="records">${pub.statements.slice(-8).reverse().map(s=>`<div class="record"><b>${esc(personName(s.playerId))}</b><p>${esc(s.text)}</p></div>`).join('')}</div>`:''}`; }
function help(pub,me) { if(!['search1','search2','confrontation'].includes(pub.stage))return ''; return `<details class="plain" data-detail="help"><summary>不知道该怎么继续？</summary><div class="tight" style="margin-top:14px"><p class="small">先问：这份证据证明到哪一步？还缺哪一段原始记录？需要时，全桌同意可展开提示。</p>${pub.hints.map((h,i)=>`<div class="notice">提示${i+1}：${esc(h)}</div>`).join('')}${pub.hintPending?`<div class="notice">正在申请下一条提示 · ${pub.hintApprovedCount}/${pub.story.players}人同意${me?`<button class="fill" style="margin-top:10px" data-do="hint_approve" ${me.hintApproved?'disabled':''}>${me.hintApproved?'你已同意':'同意展开提示'}</button>`:''}</div>`:pub.hints.length<pub.hintLimit?'<button data-do="hint_request">请大家确认，展开下一条提示</button>':''}</div></details>`; }
function joinCard(pub) {

}
function paperKey(pub){return `sr:paper:${pub.code}:${pub.stageId}`;}
function paperDraft(pub){try{return JSON.parse(sessionStorage.getItem(paperKey(pub)))||{open:false,ballots:{}};}catch{return {open:false,ballots:{}};}}

function conversationPhone(pub,me){

function conversationVote(pub){

function conversationHost(pub){

function screenHostContent(pub){

async function demoOthers() {
  const initial=state.public.stage;
  if(initial==='lobby'){await dispatch('start',{},hostToken);setState(await getState());return;}
  if(['ended','aborted'].includes(initial)){notify('这一局已结束，可用公共屏返回大厅。');return;}
  const own=await getState();
  if(initial==='vote'&&!own.me.ballot){notify(`先在右边提交你自己的选票，再替其余${own.public.story.players-1}人完成。`);return;}
  for(let i=0;i<demoPlayers.length;i++) {
    const p=demoPlayers[i];if(p.token===token)continue;
    let s=await getState(p.token);if(s.public.stage!==initial)break;
    if(['search1','search2'].includes(initial)){
      const round=initial==='search1'?1:2;
      if(!s.me.searches[round])s=await dispatch('search',{locationId:s.public.locations[i%s.public.locations.length].id},p.token);
      if(!s.me.ready)await dispatch('ready',{value:true},p.token);
    } else if(initial==='confrontation') {if(!s.me.spoke)await dispatch('speak',{},p.token);if(!s.me.ready)await dispatch('ready',{value:true},p.token);}
    else if(initial==='vote') {if(!s.me.ballot)await dispatch('vote',own.me.ballot,p.token);}
    else if(!s.me.ready)await dispatch('ready',{value:true},p.token);
  }
  setState(await getState());
}

  const dialog=$('#confirm');$('#confirm-title').textContent=`用${id}询问谁？`;$('#confirm-text').innerHTML=`<label for="cite-target">先选一个人，问题用嘴说。</label><select id="cite-target">${choices.map(p=>`<option value="${esc(p.id)}">${esc(p.role.name)} · ${esc(p.role.brief)}</option>`).join('')}</select>`;
  const selected=await new Promise(resolve=>{dialog.showModal();$('#confirm-ok').onclick=()=>{const value=$('#cite-target').value;dialog.close();resolve(value);};$('#confirm-cancel').onclick=()=>{dialog.close();resolve(null);};dialog.oncancel=e=>{e.preventDefault();dialog.close();resolve(null);};});
  if(selected)await dispatch('cite',{evidenceId:id,targetId:selected});
}
app.addEventListener('click',event=>{
  const button=event.target.closest('[data-do]');if(!button||button.disabled)return; const action=button.dataset.do;
  const investigator=action==='screen_search'?$('#screen-investigator')?.value:null;
  if(action==='tab'){tab=button.dataset.tab;render();return;}
  if(action==='resume'){const mode=button.dataset.mode,room=button.dataset.room;location.href=mode==='d'?`/?demo=${room}`:`/?room=${room}${mode==='h'?'&screen=host':''}`;return;}
  if(action==='rejoin'){localStorage.removeItem(storageKey('p',code));state=null;joinPage();return;}
  run(async()=>{
    if(action==='demo'){const story=info.stories.find(s=>s.id===selectedStoryId)||info.stories[0];if(await confirmAction('单人试玩会剧透',`你会在一个页面中切换全部${story.players}个角色。准备和朋友正式玩这个案件的人，建议直接创建公共屏。`))await create(true);}
    else if(action==='start') {await dispatch('start',{},hostToken||token);if(demo)setState(await getState());}
    else if(action.startsWith('screen_')){
      let data={};
      if(action==='screen_search')data={playerId:investigator,locationId:button.dataset.id};
      if(action==='screen_supplement'||action==='screen_verify')data={evidenceId:button.dataset.id};
      if(action==='screen_speak')data={playerId:button.dataset.id,value:button.dataset.value==='true'};
      if(action==='screen_hint'){if(!await confirmAction('全桌同意展开提示？','请先口头确认大家都希望得到下一条提示。'))return;data={agreed:true};}
      await dispatch(action,data,hostToken||token);if(demo)setState(await getState());
    }
    else if(action==='paper-open'){const draft=paperDraft(state.public);draft.open=true;savePaper(state.public,draft);}
    else if(action==='print-ballots')printBallots(state.public);
    else if(action==='ready')await dispatch('ready',{value:button.dataset.value==='true'});
    else if(action==='search')await dispatch('search',{locationId:button.dataset.id});
    else if(action==='publish')await dispatch('publish',{evidenceId:button.dataset.id});
    else if(action==='supplement')await dispatch('supplement',{evidenceId:button.dataset.id});
    else if(action==='cite')await cite(button.dataset.id);
    else if(action==='speak'||action==='hint_request'||action==='hint_approve')await dispatch(action);
    else if(action==='demo-others')await demoOthers();
    else if(action==='copy'){const url=`${lanBase}/?room=${code}`;try{await navigator.clipboard.writeText(url);notify('邀请链接已复制。');}catch{notify(`邀请地址：${url}`);}}
    else if(action==='remove'){if(await confirmAction('移除这个席位？','被移除的人可重新扫码加入。'))await dispatch('remove',{playerId:button.dataset.id},hostToken||token);}
    else if(action==='abort'){if(await confirmAction('中止本局？','这不会产生胜负结局。所有人会保留席位，可回到大厅重新开始。')){await dispatch('abort',{},hostToken||token);if(demo)setState(await getState());}}
    else if(action==='reset'){if(await confirmAction('回到大厅？','保留所有席位，清空本局进度并重新分配角色。这个案件的真相不会改变，可先保存复盘。')){await dispatch('reset',{},hostToken||token);drafts.clear();if(demo)setState(await getState());}}
    else if(action==='export'){const pub=state.public;const blob=new Blob([JSON.stringify({title:pub.story.title,result:pub.result,replay:pub.replay,timeline:pub.timeline,evidence:pub.evidence},null,2)],{type:'application/json'});const url=URL.createObjectURL(blob);const link=document.createElement('a');link.href=url;link.download=`诡境-${pub.story.title}-${code}-复盘.json`;link.click();setTimeout(()=>URL.revokeObjectURL(url),1000);}
  });
});
app.addEventListener('change',event=>{
  if(event.target.id==='screen-investigator')investigatorSelections.set(state.public.stageId,event.target.value);
  if(event.target.name==='storyId'&&event.target.tagName==='SELECT'){selectedStoryId=event.target.value;home();}
  if(event.target.id==='lan-base'){lanBase=event.target.value;render();}
  if(event.target.id==='demo-player'){run(async()=>{demoIndex=Number(event.target.value);token=demoPlayers[demoIndex].token;setState(await getState());connect();});}
  if(event.target.closest('#vote-form')){const form=new FormData($('#vote-form'));drafts.set(token,{suspectId:form.get('suspectId'),reasonId:form.get('reasonId'),testify:form.get('testify')===null?undefined:form.get('testify')==='true'});}
  if(event.target.closest('#paper-form')){
    const data=new FormData($('#paper-form')),draft=paperDraft(state.public);draft.revealed=data.get('revealed')==='on';
    for(const p of state.public.players)draft.ballots[p.id]={suspectId:data.get(`suspect-${p.id}`),reasonId:data.get(`reason-${p.id}`)};
    savePaper(state.public,draft);
  }
});
app.addEventListener('submit',event=>{
  event.preventDefault(); const form=event.target;const data=new FormData(form);
  run(async()=>{
    if(form.id==='create-form')await create(false,data.get('storyId'));
    else if(form.id==='join-home')location.href=`/?room=${encodeURIComponent(data.get('room').trim())}`;
    else if(form.id==='join-form'){const joined=await api(`/api/rooms/${code}/join`,{method:'POST',body:{nickname:data.get('nickname')}});remember('p',code,joined);token=joined.token;setState(await getState());connect();}
    else if(form.id==='vote-form')await dispatch('vote',{suspectId:data.get('suspectId'),reasonId:data.get('reasonId'),testify:data.get('testify')==='true'});
    else if(form.id==='statement-form'){await dispatch('statement',{text:data.get('text')});notify('已记录到公共屏，等待大家核实。');}
    else if(form.id==='paper-form'){
      const ballots=state.public.players.map(p=>({playerId:p.id,suspectId:data.get(`suspect-${p.id}`),...(state.public.flowVersion===2?{}:{reasonId:data.get(`reason-${p.id}`)})}));
      if(await confirmAction('按纸票揭晓结果？',`请核对公共屏上的${countWord(state.public.story.players)}张选票。确认后一次提交并公布真相。`)){await dispatch('screen_votes',{ballots,revealed:data.get('revealed')==='on'},hostToken||token);if(demo)setState(await getState());}
    }
  });
});
async function init(){
  info=await api('/api/info');
  code=query.get('demo')||query.get('room');
  if(!code){home();return;}
  if(!/^\d{6}$/.test(code)){showFatal('房间码应为6位数字。');return;}
  if(demo){const saved=recalled('d',code);if(!saved?.players){showFatal('试玩凭证只保存在创建它的电脑浏览器中。');return;}hostToken=saved.token;demoPlayers=saved.players;token=demoPlayers[0].token;}
  else if(hostMode){token=recalled('h',code)?.token;hostToken=token;if(!token){showFatal('这台浏览器没有公共屏凭证。请使用创建房间时的浏览器。');return;}}
  else token=recalled('p',code)?.token;
  if(!token){await joinPage();return;}
  try{setState(await getState());connect();}catch(error){showFatal(error.message);}
}
init().catch(error=>showFatal(`连接失败：${error.message}。请确认游戏服务已经启动。`));
</script>
</body></html>
